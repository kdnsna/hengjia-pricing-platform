  seed: |
    # Narrative

    A furniture and spatial design studio portfolio presenting 30+ projects through a spreadsheet-inspired data table interface. The narrative flow is non-linear: visitors scan a dense index of projects (numbered, dated, named) and hover to reveal project imagery. The site treats the portfolio as a database—each row is a project entry with sortable/filterable metadata (year, collection, typology, client, location, dimensions, materials). Two auxiliary views (Overview, About) accessible via header links. The overall intent is archival precision mixed with tactile browsing.

    # Tech Stack

    Nuxt 3 (Vue-based SSG/SPA) with Tailwind CSS v4.1.10. Custom CSS properties for spacing system (`--spacing: .1rem`, `--spacing-gutter`, `--spacing-roof`). No external animation library—interactions implemented via native Vue transitions and CSS keyframes.

    # Layout

    Fixed header with 24-column CSS Grid (`grid-template-columns: repeat(24, minmax(0, 1fr))`). Data table body scrolls independently while header remains pinned. Each project row spans full width with columns allocated: number (2), name (3), collection (variable), typology (2), client (3), location (2), dimensions (3), materials (3). Mobile collapses to single column with truncated text. Negative space is minimal—information density is the organizing principle. See `references/layout.md` for grid implementation.

    # Typography

    Primary font: Foundry Gridnik (custom woff2, medium weight). Monospace-inspired sans with squared terminals and uniform stroke width. CSS custom property: `--font-primary: "foundrygridnik", sans-serif`. Base size scales with viewport; line-height set to `1.2` (`--leading-normal`). Text treatment includes "capitalized" labels—hover reveals full word from single-letter fragments (each letter wrapped in span, opacity transition). Table headers at 20% opacity; hovered rows at 100%.

    # Color

    Strict monochrome: `#000` text on `#fff` background. No accent colors. Opacity used for hierarchy: 5% (disabled), 15% (not-hovered), 20% (header/secondary), 100% (active). `mix-blend-mode: difference` applied to fixed home-screen layer, inverting text color over project imagery. Theme-color meta set to `#fff`.

    # Imagery

    Project photography appears in fixed-position overlay on hover—full-bleed within viewport, aspect-ratio 518/744 (portrait orientation). Images sourced from Sanity CMS. Photography style: documentary, neutral backgrounds, material-focused (aluminum, wood, steel, stone). No illustration or 3D render—only photographic documentation of physical objects and installations.

    # Components

    **Data table row**: Grid-based with 8 columns. Hover state triggers opacity cascade—non-hovered rows dim to 15%.

    **Marquee text**: On hover, truncated cell text expands into scrolling marquee (CSS animation `marquee-0f5c8266`, linear, infinite). Fade masks on left/right edges via gradient overlay (`linear-gradient(90deg,#000,#0000 10%,#0000 90%,#000)`).

    **Capitalize component**: First letter always visible; remaining letters fade in on hover (transition-delay 0.3s).

    **Filter button**: 20% opacity default, 7% on hover, 100% when filters active.

    **Custom cursor**: Absolute-positioned element following mouse, translates based on `--right-bound` variable. See `references/motion.md`.

    # Motion

    Staggered entrance: Each table row fades in with delay calculated as `index * 106ms` (30 projects × stagger = ~3.2s total sequence). CSS transition on opacity with `cubic-bezier(.4,0,.2,1)` easing. Page transitions: 0.4s opacity fade. Marquee animation duration calculated per text width. Hover states: 0.15s–0.3s transitions. See `references/motion.md` for implementation details.

    # Algorithms

    Standard implementation, no special design.

    # Material

    Standard implementation, no special design.

    # Craft

    Scroll indicator: SVG arrow appears at table bottom when scrollable, rotates 180° when reaching end. Safe area insets respected (`--vueuse-safe-area-top` etc.). Touch-action optimized for mobile scrolling. All interactive elements have `pointer-events` toggled during transitions to prevent double-clicks.
