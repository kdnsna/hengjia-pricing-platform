    layout: |
      # Layout Reference

      ## Grid System

      24-column grid with variable gaps:
      - Mobile: `gap: calc(var(--spacing, .1rem) * 6)` (0.6rem)
      - Desktop (≥48rem): `gap: calc(var(--spacing, .1rem) * 12)` (1.2rem)

      ```css
      .ui-data-table-row {
        display: grid;
        gap: calc(var(--spacing, .1rem) * 6);
        grid-template-columns: repeat(24, minmax(0, 1fr));
        width: 100%;
      }

      @media (min-width: 48rem) {
        .ui-data-table-row {
          gap: calc(var(--spacing, .1rem) * 12);
        }
      }
      ```

      ## Column Allocation

      | Column | Span | Content |
      |--------|------|---------|
      | 1 | 2 | Number (index) |
      | 2 | 3 | Project name (marquee) |
      | 3 | variable | Collection |
      | 4 | 2 | Typology |
      | 5 | 3 | Client |
      | 6 | 2 | Location |
      | 7 | 3 | Dimensions (L×W×H) |
      | 8 | 3 | Materials |

      ## Spacing System

      Base unit: `--spacing: .1rem` (1px at root 10px)

      - `--spacing-gutter`: Horizontal page padding
      - `--spacing-roof`: Vertical header padding
      - `--spacing-full`: 100%
      - `--spacing-lh`: 1lh (line-height relative)
      - `--spacing-em`: 1em

      ## Fixed Home Screen

      ```css
      .home-screen {
        position: fixed;
        inset: 0;
        bottom: auto;
        max-height: calc(100svh - 22rem);
        padding-block: var(--spacing-roof);
        padding-inline: var(--spacing-gutter);
        pointer-events: none;
        z-index: var(--z-index-home, 100);
        mix-blend-mode: difference;
        color: #fff;
      }

      @media (min-width: 48rem) {
        .home-screen {
          max-height: none;
        }
      }
      ```

      ## Z-Index Layers

      - `--z-index-home`: 100 (table interface)
      - `--z-index-about`: 150 (about page overlay)

      ## Responsive Behavior

      Mobile (<48rem):
      - Most columns hidden (`hidden md:block`)
      - Only number, name, and truncated info visible
      - Table body scrolls with momentum

      Desktop (≥48rem):
      - Full 8-column layout
      - Header remains fixed while body scrolls
      - Hover interactions enabled
- short_id: UaTyOP4I
  seed: |
    # Narrative

    A design studio portfolio presenting work as a systematic catalog. The site opens with a full-screen data table where projects are listed chronologically in rows with four column headers: Date, Object, Subject, Control. The "Object" column categorizes work by medium (Exhibition, Publication, Visual Identity, Poster, etc.), while "Subject" names the client or project. This tabular format treats the portfolio as an archival index rather than a visual showcase—no thumbnails, only typographic entries. The Control column provides a toggle interface for sorting and filtering.

    # Tech Stack

    WordPress with WooCommerce (shop functionality present), custom theme. jQuery-based interactions for sorting and AJAX navigation. FastClick for touch optimization. Magnific Popup for lightbox galleries on project pages.

    # Layout

    Strict 7-column grid system with visible vertical borders between columns. The grid lines are rendered as 1px borders on `.col` elements, creating a ruled paper aesthetic. Full-bleed layout with no max-width constraint—content extends to viewport edges. Header contains a slide-out navigation menu triggered by "-" toggle. Sticky table headers remain fixed during scroll. Each project row is a full-width clickable link.

    Column structure: Date (2/7), Object (2/7), Subject (2/7), Control (1/7). Mobile collapses to single column showing Date only.

    # Typography

    Primary typeface: **TP Vorzeit Grotesk Demi** — a custom grotesque sans-serif with distinctive character. Loaded via `@font-face` from WOFF2/WOFF/TTF/EOT formats. Font-weight 600, tight line-height (1), optimized legibility with `-webkit-font-smoothing: antialiased` and `-moz-osx-font-smoothing: grayscale`.

    Base size: 13px with viewport-relative scaling (`3.4vw` for large headings). All-caps treatment on column headers. Text links use underline via repeating background image technique (PNG base64 data URI) positioned at `left 7vw` (desktop: `left 3.5vw`).

    # Color

    Strict monochrome: `#000` (black) text on `#fff` (white) background. No accent colors, no gradients. Links inherit black with underline decoration. Hover states invert to white text on black background (`background:#000; color:#fff`). Grid borders are black. This binary palette reinforces the archival, systematic character.

    # Imagery

    No imagery on the index page—purely typographic. Project detail pages (not visible in this view) contain photography and visual work presented in a lightbox gallery. The portfolio's index deliberately suppresses visuals in favor of the catalog metaphor.

    # Components

    **Navigation**: Slide-out menu with "-" toggle icon. Menu organized in three columns: Output (work categories), Soft (articles/lectures/philosophy), Hard (contact/info). Hidden on mobile behind hamburger.

    **Table Headers**: Clickable sort triggers with `data-sort` attributes (date, cat, name). Sticky positioning on scroll.

    **Links**: Custom underline implementation using background-image with 1px PNG pattern, positioned below baseline.

    **Control Toggle**: "Out of control" / "Control" text toggle in header and table head—switches view modes.

    # Motion

    Subtle fade-in on page load (`fadeIn` animation, 0.2s duration). Menu toggle slides navigation panel. Sorting reorders rows with DOM manipulation (no animated transitions). Lightbox opens with `mfp-fade` class for fade transition. Cursor-following "+" sign appears on gallery image hover.

    # Algorithms

    Standard implementation, no special design.

    # Material

    Standard implementation, no special design.

    # Craft

    **Grid lines**: Visible 1px black borders between all seven columns, created via `.bordered` class on column divs. Creates the ruled paper / spreadsheet aesthetic.

    **Font synthesis disabled**: `font-synthesis: none` prevents browser from artificially bolding/italicizing the custom typeface.

    **Text rendering**: `text-rendering: optimizeLegibility` and OpenType ligatures enabled via `-moz-font-feature-settings: 'liga'`.

    **Touch optimization**: FastClick library attached to document body for instant tap response on mobile.

<system-reminder>
The risk is not borrowing too little — it is subconsciously simplifying what you borrowed. Cutting corners is forbidden in any form: never replace a reference's technique, material, structure, or motion with a cheaper version of your own. Downgrades follow repeatable patterns (illustrative, not exhaustive): input-driven motion (scroll/pointer/time) → one-shot keyframes or static states; shape-language transformation (morph/clip/mask) → the cheapest properties (scale/translate/opacity); asymmetric layout rhythm (irregular grids, editorial composition) → uniform columns and full-width stacks; layered material (blend/texture/depth) → flat single-layer fills; bespoke vessels (framing devices, illustrated components) → default cards and pills; choreographed sequences (staged, multi-step, gated) → single triggers or fakes; typographic systems (pairing/scale/font features) → swapping the font-family; styled components → library-default skins. If your version is simpler than the reference's, that is a downgrade. Implement at the reference's fidelity.
</system-reminder>
